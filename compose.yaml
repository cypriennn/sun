name: sun

services:
  sun:
    build: .
    image: ghcr.io/cypriennn/sun:latest
    container_name: sun
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SUN_CONFIG: /app/config.toml
      SUN_BIND: 0.0.0.0:3030
    ports:
      - "${SUN_LISTEN:-127.0.0.1:3030}:3030"
    volumes:
      - type: bind
        source: ./config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - sun_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  sun_data:
